name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  actionlint:
    name: Lint Workflows & Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-pr-check

  test-build:
    name: Test Build (${{ matrix.os }} / Hugo ${{ matrix.hugo-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        hugo-version: ["latest", "0.151.2"]
    steps:
      - uses: actions/checkout@v6

      - name: Create sample Hugo site
        shell: bash
        run: |
          mkdir -p test-site/content test-site/layouts/_default
          cat << 'EOF' > test-site/hugo.toml
          baseURL = "https://example.org/"
          languageCode = "en-us"
          title = "CI Test Hugo Site"
          EOF
          cat << 'EOF' > test-site/layouts/index.html
          <!DOCTYPE html><html><head><title>{{ .Site.Title }}</title></head><body><h1>{{ .Site.Title }}</h1>{{ .Content }}</body></html>
          EOF
          cat << 'EOF' > test-site/content/_index.md
          ---
          title: "Home"
          ---
          Hello Hugo!
          EOF

      - name: Run Deploy Hugo to S3 Action (Build Only)
        id: hugo-action
        uses: ./
        with:
          hugo-version: ${{ matrix.hugo-version }}
          working-directory: test-site
          destination: dist
          skip-deployment: "true"

      - name: Verify Build Output
        shell: bash
        run: |
          set -euo pipefail
          echo "Installed Hugo version: ${{ steps.hugo-action.outputs.hugo-version-installed }}"
          echo "Build path: ${{ steps.hugo-action.outputs.build-path }}"
          test -f "test-site/dist/index.html"
          grep -q "CI Test Hugo Site" "test-site/dist/index.html"
