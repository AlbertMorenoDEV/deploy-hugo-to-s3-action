name: "Deploy Hugo to S3"
description: "Build and deploy Hugo static websites to AWS S3"
author: "AlbertMorenoDEV"
branding:
  icon: zap
  color: orange
inputs:
  hugo-version:
    description: "Choose a valid Hugo version"
    required: true
  aws-access-key-id:
    description: "AWS Access Key ID"
    required: false
  aws-secret-access-key:
    description: "AWS Secret Access Key"
    required: false
  aws-role-to-assume:
    description: "AWS Role to Assume"
    required: false
  aws-region:
    description: "AWS Region"
    required: false
  target:
    description: "A deployment target"
    required: false
    default: ""
  config:
    description: "Config file"
    required: false
    default: ""
  environment:
    description: "environment"
    required: false
    default: ""
  skip-deployment:
    description: "Skip deployment to AWS"
    required: false
    default: "false"
  build-args:
    description: "Additional arguments for the 'hugo' build command"
    required: false
    default: ""
  deploy-args:
    description: "Additional arguments for the 'hugo deploy' command"
    required: false
    default: ""
  destination:
    description: "Destination directory for the Hugo build output"
    required: false
    default: "public"
runs:
  using: "composite"
  steps:
    - id: validate-inputs
      run: |
        if [[ "${{ inputs.aws-role-to-assume }}" != "" && "${{ inputs.aws-region }}" == "" ]]; then
          echo "::error::aws-region is required when using OIDC"
          exit 1
        fi
        if [[ ! "${{ inputs.hugo-version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::warning::Hugo version '${{ inputs.hugo-version }}' might not be a valid semver. Proceeding anyway..."
        fi
      shell: bash

    - name: Cache Hugo Binary
      id: cache-hugo
      uses: actions/cache@v3
      with:
        path: ${{ runner.temp }}/hugo-bin
        key: hugo-${{ runner.os }}-${{ runner.arch }}-${{ inputs.hugo-version }}

    - id: install-hugo
      if: steps.cache-hugo.outputs.cache-hit != 'true'
      run: |
        set -e
        mkdir -p ${{ runner.temp }}/hugo-bin

        if [[ "${{ runner.os }}" == "Linux" ]]; then
          HUGO_OS="Linux"
          HUGO_EXTENSION="tar.gz"
        elif [[ "${{ runner.os }}" == "Windows" ]]; then
          HUGO_OS="Windows"
          HUGO_EXTENSION="zip"
        elif [[ "${{ runner.os }}" == "macOS" ]]; then
          HUGO_OS="macOS"
          HUGO_EXTENSION="tar.gz"
        fi

        if [[ "${{ runner.arch }}" == "X64" ]]; then
          HUGO_ARCH="64bit"
        elif [[ "${{ runner.arch }}" == "ARM64" ]]; then
          HUGO_ARCH="ARM64"
        fi

        HUGO_DOWNLOAD=hugo_extended_withdeploy_${{ inputs.hugo-version }}_${HUGO_OS}-${HUGO_ARCH}.${HUGO_EXTENSION}
        wget https://github.com/gohugoio/hugo/releases/download/v${{ inputs.hugo-version }}/${HUGO_DOWNLOAD}

        if [[ "${{ runner.os }}" == "Windows" ]]; then
          unzip ${HUGO_DOWNLOAD}
        else
          tar xvzf ${HUGO_DOWNLOAD} hugo
        fi

        mv hugo ${{ runner.temp }}/hugo-bin/hugo
        rm ${HUGO_DOWNLOAD}
      shell: bash

    - id: verify-hugo
      run: |
        ${{ runner.temp }}/hugo-bin/hugo version
      shell: bash

    - id: download-themes
      run: |
        set -e
        git submodule init
        git submodule update
      shell: bash

    - id: configure-aws-credentials
      if: "${{ inputs.aws-role-to-assume != '' }}"
      uses: aws-actions/configure-aws-credentials@v1
      with:
        role-to-assume: ${{ inputs.aws-role-to-assume }}
        aws-region: ${{ inputs.aws-region }}

    - id: hugo-build
      run: |
        set -e
        # Build arguments.
        HUGO_BUILD_FLAGS=("-d" "${{ inputs.destination }}")
        
        if [[ "${{ inputs.environment }}" ]]; then
          HUGO_BUILD_FLAGS+=("--environment" "${{ inputs.environment }}")
        fi

        if [[ "${{ inputs.config }}" ]]; then
          HUGO_BUILD_FLAGS+=("--config" "${{ inputs.config }}")
        fi

        # Add custom build args if provided.
        if [[ "${{ inputs.build-args }}" ]]; then
          read -r -a EXTRA_BUILD_ARGS <<< "${{ inputs.build-args }}"
          HUGO_BUILD_FLAGS+=("${EXTRA_BUILD_ARGS[@]}")
        fi

        ${{ runner.temp }}/hugo-bin/hugo "${HUGO_BUILD_FLAGS[@]}"
      shell: bash

    - id: deploy-to-s3
      if: inputs.skip-deployment == 'false'
      run: |
        set -e

        # Initialize an array to hold the Hugo flags.
        HUGO_FLAGS=("--logLevel" "info" "--invalidateCDN" "--maxDeletes" "-1")

        # Add the environment flag if it is provided.
        if [[ "${{ inputs.environment }}" ]]; then
          HUGO_FLAGS+=("--environment" "${{ inputs.environment }}")
        fi

        # Add the config flag if it is provided.
        if [[ "${{ inputs.config }}" ]]; then
          HUGO_FLAGS+=("--config" "${{ inputs.config }}")
        fi

        # Add the target flag if it is provided.
        if [[ "${{ inputs.target }}" ]]; then
          HUGO_FLAGS+=("--target" "${{ inputs.target }}")
        fi

        # Add custom deploy args if provided.
        if [[ "${{ inputs.deploy-args }}" ]]; then
          read -r -a EXTRA_DEPLOY_ARGS <<< "${{ inputs.deploy-args }}"
          HUGO_FLAGS+=("${EXTRA_DEPLOY_ARGS[@]}")
        fi

        # Deploy the website.
        ${{ runner.temp }}/hugo-bin/hugo deploy "${HUGO_FLAGS[@]}"
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
      shell: bash

